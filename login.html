<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN - ELITE CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;}
  body{
    background:#000; 
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* HEADER */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 5%;
    background:rgba(0,0,0,0.9);
    border-bottom:1px solid #111;
  }
  header h1{font-size:20px;letter-spacing:2px; font-weight:900;}
  header a{color:#D4AF37; text-decoration:none; font-size:14px; font-weight:600;}
  header a:hover{text-decoration:underline;}

  /* LOGIN BOX */
  .login-wrapper{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8)), 
               url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070') center/cover no-repeat;
  }
  .login-box{
    width:100%;
    max-width:420px;
    background:#0a0a0a;
    border:1px solid #222;
    padding:40px 30px;
    text-align:left;
  }
  .login-box h2{
    font-size:clamp(32px, 5vw, 48px);
    font-weight:900;
    text-transform:uppercase;
    line-height:1.1;
    margin-bottom:30px;
  }
  .login-box h2 span{color:#D4AF37;}

  .form-group{margin-bottom:20px;}
  .form-group label{
    display:block;
    font-size:12px;
    letter-spacing:1px;
    color:#aaa;
    margin-bottom:8px;
  }
  input{
    width:100%;
    padding:14px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    font-size:14px;
    outline:none;
    transition:0.2s;
  }
  input:focus{border-color:#D4AF37;}

  .btn{
    background:#D4AF37;
    color:#000;
    padding:14px 28px;
    border:none;
    font-weight:900;
    cursor:pointer;
    width:100%;
    letter-spacing:1px;
    transition:0.3s;
    margin-top:10px;
  }
  .btn:hover{background:#fff;}

  .extra-links{
    text-align:center;
    margin-top:20px;
    font-size:12px;
  }
  .extra-links a{
    color:#D4AF37;
    text-decoration:none;
  }
  .extra-links a:hover{text-decoration:underline;}

  /* FOOTER */
  footer{
    padding:20px;
    text-align:center;
    border-top:1px solid #111;
    font-size:12px;
    color:#555;
  }
</style>
</head>
<body>

<header>
  <h1>ELITE CLUB</h1>
  <a href="index.html">← BACK TO HOME</a>
</header>

<div class="login-wrapper">
  <div class="login-box">
    <h2>WELCOME <br><span>BACK.</span></h2>
    
    <form action="#" method="POST">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" placeholder="ENTER YOUR EMAIL" required>
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" placeholder="ENTER YOUR PASSWORD" required>
      </div>

      <button type="submit" class="btn">LOGIN →</button>
    </form>

    <div class="extra-links">
      <a href="#">FORGOT PASSWORD?</a> | <a href="#">CREATE ACCOUNT</a>
    </div>
  </div>
</div>

<footer>
  <p>© 2023-2026 ELITE CLUB | Automotive culture meets entertainment</p>
</footer>

</body>
</html>
