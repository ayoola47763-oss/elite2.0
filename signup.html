<!DOCTYPE html>
<html>
<head>
  <title>Elite Club - Sign Up</title>
  <style>
    body { font-family: Arial; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: #1a1a1a; padding: 30px; border-radius: 10px; width: 300px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    button { background: gold; color: black; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Sign Up</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <input type="text" id="name" placeholder="Your Name">
    <button onclick="signup()">Create Account</button>
    <p>Already have account? <a href="login.html" style="color: gold;">Login</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyA9_06i2rVVM9Rms6B0lc15OzRXBe8xsoM",
      authDomain: "elite-club-98bc4.firebaseapp.com",
      projectId: "elite-club-98bc4",
      storageBucket: "elite-club-98bc4.firebasestorage.app",
      messagingSenderId: "625107067225",
      appId: "1:625107067225:web:c7d0229631660c29502c48",
      measurementId: "G-8Y2FVNZF7Z"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signup = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          return updateProfile(userCredential.user, { displayName: name });
        })
        .then(() => {
          alert('Account created!');
          window.location.href = 'login.html';
        })
        .catch((error) => alert(error.message));
    }
  </script>
</body>
</html>
